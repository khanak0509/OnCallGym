[project]
name = "oncallgym-env"
version = "0.1.0"
description = "OnCallGym: on-call incident response tasks on a simulated microservice backend"
requires-python = ">=3.11"
dependencies = ["verifiers==0.4.1", "httpx", "oncallgym"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncallgym_env"]
